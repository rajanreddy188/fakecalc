<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Calculator</title>
  <style>
    :root {
      --gap: 8px;
      --side: clamp(12px, 4vw, 18px);
      --button-size: min(calc((100vw - (2 * var(--side)) - (3 * var(--gap))) / 4), 82px);
      --digit-bg: #333333;
      --function-bg: #a5a5a5;
      --operator-bg: #ff9f0a;
      --press-bg: #fff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   Helvetica, Arial, sans-serif;
      color: #fff;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .app {
      width: min(100vw, 430px);
      height: 100dvh;
      min-height: 600px;
      padding:
        max(10px, env(safe-area-inset-top))
        var(--side)
        max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
      flex: 0 0 auto;
    }

    .top-button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 0;
      background: #1f1f1f;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .top-button:active { background: #3a3a3a; }

    .list-icon {
      width: 23px; height: 23px; position: relative;
    }
    .list-icon::before {
      content: "";
      position: absolute; inset: 3px 1px;
      background:
        radial-gradient(circle at 2px 3px, #fff 0 1.5px, transparent 1.7px),
        radial-gradient(circle at 2px 9px, #fff 0 1.5px, transparent 1.7px),
        radial-gradient(circle at 2px 15px, #fff 0 1.5px, transparent 1.7px),
        linear-gradient(#fff,#fff) 7px 2px/15px 2px no-repeat,
        linear-gradient(#fff,#fff) 7px 8px/15px 2px no-repeat,
        linear-gradient(#fff,#fff) 7px 14px/15px 2px no-repeat;
      opacity: .95;
    }

    .calc-icon {
      width: 19px; height: 23px;
      border: 1.6px solid #fff;
      border-radius: 3px;
      position: relative;
    }
    .calc-icon::before {
      content: "";
      position: absolute;
      left: 3px; right: 3px; top: 3px;
      height: 4px;
      border-radius: 1px;
      background: #fff;
      box-shadow:
        0 7px 0 #fff, 6px 7px 0 #fff,
        12px 7px 0 #fff, 0 14px 0 #fff,
        6px 14px 0 #fff, 12px 14px 0 #fff;
      transform: scale(.62);
      transform-origin: top left;
    }

    .display {
      flex: 1 1 auto;
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 0 5px 12px;
      overflow: hidden;
    }

    .display-inner {
      width: 100%;
      text-align: right;
      overflow: hidden;
    }

    .expression {
      color: #8a8a8f;
      font-size: clamp(18px, 6vw, 29px);
      line-height: 1.15;
      min-height: 27px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      margin-bottom: 5px;
      letter-spacing: -0.3px;
      font-weight: 400;
    }

    .result {
      font-variant-numeric: tabular-nums;
      font-size: clamp(48px, 16vw, 72px);
      line-height: .98;
      font-weight: 300;
      letter-spacing: -2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      transition: font-size .08s linear;
    }

    .keypad {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      padding-top: 2px;
      padding-bottom: 2px;
    }

    button.key {
      border: 0;
      width: var(--button-size);
      height: var(--button-size);
      max-width: 82px;
      max-height: 82px;
      min-width: 0;
      min-height: 60px;
      margin: 0 auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 400;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .digit {
      background: var(--digit-bg);
      color: #fff;
    }

    .function {
      background: var(--function-bg);
      color: #000;
      font-size: clamp(25px, 7vw, 34px) !important;
    }

    .operator {
      background: var(--operator-bg);
      color: #fff;
    }

    .operator.active {
      background: #fff;
      color: var(--operator-bg);
    }

    button.key:active { filter: brightness(1.32); }
    .operator:active { filter: brightness(1.15); }
    .operator.active:active { filter: none; background: #f2f2f2; }

    .zero {
      grid-column: span 1;
    }

    @media (max-height: 720px) {
      .topbar { height: 58px; }
      .display { min-height: 80px; padding-bottom: 6px; }
      .expression { font-size: 17px; }
      .result { font-size: 56px; }
      button.key { min-height: 56px; }
    }

    @media (min-width: 500px) {
      body { align-items: center; }
      .app {
        width: 430px;
        height: min(932px, 100dvh);
        border-radius: 44px;
        overflow: hidden;
      }
    }

    .history-panel {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.97);
      display: none;
      flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
      z-index: 10;
    }

    .history-panel.open { display: flex; }

    .history-head {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
    }

    .history-title { font-size: 28px; font-weight: 500; }
    .history-list { overflow: auto; flex: 1; padding-top: 10px; }
    .history-empty { color: #8e8e93; font-size: 17px; margin-top: 30px; }
    .history-item {
      border-bottom: 1px solid #222;
      padding: 17px 0;
      text-align: right;
    }
    .history-expr { color: #8e8e93; font-size: 18px; margin-bottom: 4px; }
    .history-result { font-size: 34px; font-weight: 300; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <button class="top-button" id="historyBtn" aria-label="History"><span class="list-icon"></span></button>
      <button class="top-button" aria-label="Calculator"><span class="calc-icon"></span></button>
    </header>

    <section class="display" aria-live="polite">
      <div class="display-inner">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>
    </section>

    <section class="keypad" id="keypad" aria-label="Calculator">
      <button class="key function" data-action="clear">AC</button>
      <button class="key function" data-action="toggle-sign">±</button>
      <button class="key function" data-action="percent">%</button>
      <button class="key operator" data-op="÷">÷</button>

      <button class="key digit" data-digit="7">7</button>
      <button class="key digit" data-digit="8">8</button>
      <button class="key digit" data-digit="9">9</button>
      <button class="key operator" data-op="×">×</button>

      <button class="key digit" data-digit="4">4</button>
      <button class="key digit" data-digit="5">5</button>
      <button class="key digit" data-digit="6">6</button>
      <button class="key operator" data-op="−">−</button>

      <button class="key digit" data-digit="1">1</button>
      <button class="key digit" data-digit="2">2</button>
      <button class="key digit" data-digit="3">3</button>
      <button class="key operator" data-op="+">+</button>

      <button class="key function" data-action="backspace" aria-label="Delete">⌫</button>
      <button class="key digit zero" data-digit="0">0</button>
      <button class="key digit" data-digit=".">.</button>
      <button class="key operator" data-action="equals">=</button>
    </section>
  </main>

  <section class="history-panel" id="historyPanel">
    <header class="history-head">
      <button class="top-button" id="closeHistory" aria-label="Close">×</button>
      <div class="history-title">History</div>
      <button class="top-button" id="clearHistory" aria-label="Clear history">⌫</button>
    </header>
    <div class="history-list" id="historyList"></div>
  </section>

  <script>
    (() => {
      const resultEl = document.getElementById('result');
      const expressionEl = document.getElementById('expression');
      const keypad = document.getElementById('keypad');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');

      let current = '0';
      let stored = null;
      let operator = null;
      let waitingForOperand = false;
      let expression = '';
      let justEvaluated = false;
      let history = JSON.parse(localStorage.getItem('iosCalcHistory') || '[]');

      const opWords = {'+': '+', '−': '−', '×': '×', '÷': '÷'};

      function cleanNumber(n) {
        if (!Number.isFinite(n)) return 'Error';
        const abs = Math.abs(n);
        if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return n.toExponential(8).replace(/\.?0+e/, 'e');
        const s = String(Number(n.toPrecision(12)));
        return s;
      }

      function formatDisplay(value) {
        if (value === 'Error') return value;
        let negative = value.startsWith('-');
        let v = negative ? value.slice(1) : value;
        let parts = v.split('.');
        let int = parts[0] || '0';
        let dec = parts[1];
        const grouped = Number(int).toLocaleString('en-US', {useGrouping:true, maximumFractionDigits:0});
        return (negative ? '−' : '') + grouped + (dec !== undefined ? '.' + dec : '');
      }

      function fitResult() {
        const len = resultEl.textContent.replace(/[^\d]/g, '').length;
        if (len > 12) resultEl.style.fontSize = 'clamp(30px, 10vw, 50px)';
        else if (len > 9) resultEl.style.fontSize = 'clamp(38px, 13vw, 60px)';
        else resultEl.style.fontSize = '';
      }

      function render() {
        resultEl.textContent = formatDisplay(current);
        expressionEl.textContent = expression;
        fitResult();

        document.querySelectorAll('.operator').forEach(btn => {
          btn.classList.toggle('active', operator === btn.dataset.op && !waitingForOperand);
        });
      }

      function setCurrent(v) {
        current = v;
        render();
      }

      function inputDigit(d) {
        if (current === 'Error') reset();
        if (waitingForOperand || justEvaluated) {
          current = d === '.' ? '0.' : d;
          waitingForOperand = false;
          justEvaluated = false;
          render();
          return;
        }
        if (d === '.' && current.includes('.')) return;
        if (current === '0' && d !== '.') current = d;
        else if (current === '-0' && d !== '.') current = '-' + d;
        else if (current.replace('-', '').replace('.', '').length >= 12) return;
        else current += d;
        render();
      }

      function reset() {
        current = '0';
        stored = null;
        operator = null;
        waitingForOperand = false;
        expression = '';
        justEvaluated = false;
        render();
      }

      function backspace() {
        if (waitingForOperand || justEvaluated) return;
        if (current === 'Error' || current.length <= 1 || (current.length === 2 && current.startsWith('-'))) current = '0';
        else current = current.slice(0, -1);
        render();
      }

      function toggleSign() {
        if (current === '0' || current === 'Error') return;
        current = current.startsWith('-') ? current.slice(1) : '-' + current;
        render();
      }

      function percent() {
        if (current === 'Error') return;
        const n = Number(current);
        if (stored !== null && operator && (operator === '+' || operator === '−')) {
          current = cleanNumber(stored * n / 100);
        } else {
          current = cleanNumber(n / 100);
        }
        render();
      }

      function calculate(a, op, b) {
        const x = Number(a), y = Number(b);
        switch(op) {
          case '+': return x + y;
          case '−': return x - y;
          case '×': return x * y;
          case '÷': return y === 0 ? NaN : x / y;
        }
      }

      function chooseOperator(op) {
        if (current === 'Error') return;
        const input = Number(current);

        if (operator && stored !== null && !waitingForOperand) {
          const out = calculate(stored, operator, input);
          current = cleanNumber(out);
          stored = Number(current);
        } else {
          stored = input;
        }

        operator = op;
        expression = `${formatDisplay(current)} ${opWords[op]}`;
        waitingForOperand = true;
        justEvaluated = false;
        render();
      }

      function equals() {
        if (current === 'Error' || operator === null || stored === null) return;
        const left = stored;
        const right = Number(current);
        const op = operator;
        const out = cleanNumber(calculate(left, op, right));
        const expr = `${formatDisplay(cleanNumber(left))} ${opWords[op]} ${formatDisplay(cleanNumber(right))}`;
        addHistory(expr, out);

        current = out;
        expression = expr;
        stored = null;
        operator = null;
        waitingForOperand = false;
        justEvaluated = true;
        render();
      }

      function addHistory(expr, out) {
        history.unshift({expr, out});
        history = history.slice(0, 50);
        localStorage.setItem('iosCalcHistory', JSON.stringify(history));
      }

      function drawHistory() {
        if (!history.length) {
          historyList.innerHTML = '<div class="history-empty">No Calculations</div>';
          return;
        }
        historyList.innerHTML = history.map((h, i) =>
          `<div class="history-item" data-i="${i}">
             <div class="history-expr">${escapeHtml(h.expr)}</div>
             <div class="history-result">${escapeHtml(formatDisplay(h.out))}</div>
           </div>`
        ).join('');
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      keypad.addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.digit !== undefined) inputDigit(b.dataset.digit);
        else if (b.dataset.op) chooseOperator(b.dataset.op);
        else {
          switch(b.dataset.action) {
            case 'clear': reset(); break;
            case 'backspace': backspace(); break;
            case 'toggle-sign': toggleSign(); break;
            case 'percent': percent(); break;
            case 'equals': equals(); break;
          }
        }
      });

      document.addEventListener('keydown', e => {
        if (historyPanel.classList.contains('open')) {
          if (e.key === 'Escape') historyPanel.classList.remove('open');
          return;
        }
        if (/^[0-9.]$/.test(e.key)) inputDigit(e.key);
        else if (['+','-','*','/'].includes(e.key)) chooseOperator({'+':'+','-':'−','*':'×','/':'÷'}[e.key]);
        else if (e.key === 'Enter' || e.key === '=') equals();
        else if (e.key === 'Backspace') backspace();
        else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') reset();
        else if (e.key === '%') percent();
      });

      document.getElementById('historyBtn').addEventListener('click', () => {
        drawHistory();
        historyPanel.classList.add('open');
      });

      document.getElementById('closeHistory').addEventListener('click', () => {
        historyPanel.classList.remove('open');
      });

      document.getElementById('clearHistory').addEventListener('click', () => {
        history = [];
        localStorage.removeItem('iosCalcHistory');
        drawHistory();
      });

      // Swipe-left/right on display acts like delete/backspace for convenience.
      let touchX = null;
      document.querySelector('.display').addEventListener('touchstart', e => {
        touchX = e.changedTouches[0].clientX;
      }, {passive:true});
      document.querySelector('.display').addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 70 && dx > 0) backspace();
        touchX = null;
      }, {passive:true});

      render();
    })();
  </script>
</body>
</html>
