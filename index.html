<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculator">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Calculator</title>
<style>
  :root{
    --bg:#000;
    --digit:#333334;
    --digit-pressed:#737374;
    --function:#5c5c5e;
    --function-pressed:#a6a6a8;
    --operator:#ff9500;
    --operator-pressed:#ffc66b;
    --muted:#8e8e93;
    --gap:clamp(8px,2.15vw,12px);
    --pad:clamp(8px,2.1vw,14px);
    --key:min(
      calc((100vw - (2 * var(--pad)) - (3 * var(--gap))) / 4),
      92px
    );
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    width:100%;
    height:100%;
    margin:0;
    background:var(--bg);
    color:#fff;
    overflow:hidden;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  }

  body{
    display:flex;
    justify-content:center;
  }

  .calculator{
    width:min(100vw,430px);
    height:100dvh;
    background:#000;
    padding:
      max(env(safe-area-inset-top),8px)
      var(--pad)
      max(env(safe-area-inset-bottom),8px);
    display:flex;
    flex-direction:column;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }

  .toolbar{
    height:58px;
    flex:none;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .round-tool{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#1c1c1e;
    display:grid;
    place-items:center;
    padding:0;
    color:#fff;
  }

  .round-tool svg{
    width:21px;
    height:21px;
    display:block;
  }

  .screen{
    flex:1;
    min-height:140px;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    padding:0 3px 13px;
    overflow:hidden;
  }

  .screen-inner{
    width:100%;
    text-align:right;
  }

  .history-line{
    min-height:25px;
    margin:0 2px 4px 0;
    font-size:clamp(16px,4.6vw,22px);
    font-weight:400;
    letter-spacing:-.2px;
    color:#7d7d82;
    white-space:nowrap;
    overflow:hidden;
  }

  .main-line{
    width:100%;
    font-size:clamp(48px,14.5vw,68px);
    font-weight:300;
    line-height:1;
    letter-spacing:-1.8px;
    white-space:nowrap;
    overflow:hidden;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .keys{
    flex:none;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:var(--gap);
    padding-bottom:2px;
  }

  .key{
    appearance:none;
    -webkit-appearance:none;
    width:var(--key);
    height:var(--key);
    min-width:0;
    min-height:0;
    margin:auto;
    padding:0;
    border:0;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:#fff;
    font-family:inherit;
    font-size:clamp(26px,7.6vw,36px);
    font-weight:400;
    line-height:1;
    cursor:pointer;
    touch-action:manipulation;
    transform:translateZ(0);
    transition:
      background-color 75ms linear,
      color 75ms linear,
      transform 75ms cubic-bezier(.2,.75,.25,1);
  }

  .key.digit{ background:var(--digit); }
  .key.function{ background:var(--function); }
  .key.operator{ background:var(--operator); }

  /* This is the short flash visible in the supplied iOS screen recording. */
  .key.digit.pressed{ background:var(--digit-pressed); }
  .key.function.pressed{ background:var(--function-pressed); }
  .key.operator.pressed{ background:var(--operator-pressed); }

  /* Tiny compression gives the touch a less web-like feel without looking bouncy. */
  .key.pressed{ transform:scale(.985); }

  .key.operator.selected{
    background:#fff;
    color:var(--operator);
  }
  .key.operator.selected.pressed{
    background:#ececec;
  }

  .key svg{
    width:42%;
    height:42%;
    stroke:currentColor;
    stroke-width:1.85;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
  }

  .key.small-symbol{
    font-size:clamp(24px,6.9vw,32px);
  }

  @media(max-height:740px){
    .toolbar{height:48px}
    .screen{min-height:105px;padding-bottom:8px}
    .main-line{font-size:clamp(42px,13vw,59px)}
    .history-line{font-size:15px}
    :root{--gap:7px}
  }

  @media(min-width:431px){
    :root{
      --pad:14px;
      --gap:10px;
      --key:90px;
    }
    .calculator{width:430px}
  }

  .history-sheet{
    position:fixed;
    inset:0;
    z-index:20;
    background:#000;
    display:none;
    flex-direction:column;
    padding:max(env(safe-area-inset-top),12px) 18px max(env(safe-area-inset-bottom),12px);
  }
  .history-sheet.open{display:flex}
  .history-head{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:none;
  }
  .history-title{font-size:24px;font-weight:600}
  .history-close,.history-clear{
    color:#fff;
    background:#1c1c1e;
    border:0;
    border-radius:50%;
    width:38px;height:38px;
    font:inherit;font-size:21px;
  }
  .history-items{overflow:auto;flex:1;padding-top:8px}
  .history-empty{color:#777;font-size:17px;margin-top:24px}
  .history-item{
    text-align:right;
    padding:15px 2px;
    border-bottom:1px solid #1c1c1e;
  }
  .history-expr{color:#888;font-size:17px}
  .history-value{font-size:32px;font-weight:300;margin-top:4px}
</style>
</head>
<body>
<main class="calculator">
  <div class="toolbar">
    <button class="round-tool" id="historyButton" aria-label="Calculation history">
      <!-- clock/history icon, matching the recording -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.2 8.3A8 8 0 1 1 4.8 17"/>
        <path d="M4.2 8.3V3.9M4.2 8.3h4.4"/>
        <path d="M12 7.1v5.1l-3.2 1.9"/>
      </svg>
    </button>
    <button class="round-tool" aria-label="Calculator">
      <!-- calculator glyph -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="3.5" width="12" height="17" rx="2.3"/>
        <path d="M8.5 6.4h7v3h-7z"/>
        <path d="M9 12.2h.01M12 12.2h.01M15 12.2h.01M9 15.3h.01M12 15.3h.01M15 15.3h.01M9 18.1h.01M12 18.1h.01M15 18.1h.01"/>
      </svg>
    </button>
  </div>

  <section class="screen" aria-live="polite">
    <div class="screen-inner">
      <div class="history-line" id="historyLine"></div>
      <div class="main-line" id="mainLine">0</div>
    </div>
  </section>

  <section class="keys" id="keys">
    <button class="key function" data-action="backspace" aria-label="Backspace">
      <!-- Apple-like delete outline, drawn rather than using the generic ⌫ character -->
      <svg viewBox="0 0 28 24" aria-hidden="true">
        <path d="M10.1 4.4h11.4c2 0 3.6 1.6 3.6 3.6v8c0 2-1.6 3.6-3.6 3.6H10.1L2.9 12z"/>
        <path d="m13.2 9 6 6M19.2 9l-6 6"/>
      </svg>
    </button>
    <button class="key function small-symbol" data-action="clear" id="clearKey">AC</button>
    <button class="key function" data-action="percent">%</button>
    <button class="key operator" data-op="÷">÷</button>

    <button class="key digit" data-digit="7">7</button>
    <button class="key digit" data-digit="8">8</button>
    <button class="key digit" data-digit="9">9</button>
    <button class="key operator" data-op="×">×</button>

    <button class="key digit" data-digit="4">4</button>
    <button class="key digit" data-digit="5">5</button>
    <button class="key digit" data-digit="6">6</button>
    <button class="key operator" data-op="−">−</button>

    <button class="key digit" data-digit="1">1</button>
    <button class="key digit" data-digit="2">2</button>
    <button class="key digit" data-digit="3">3</button>
    <button class="key operator" data-op="+">+</button>

    <button class="key digit small-symbol" data-action="sign">⁺/₋</button>
    <button class="key digit" data-digit="0">0</button>
    <button class="key digit" data-digit=".">.</button>
    <button class="key operator" data-action="equals">=</button>
  </section>
</main>

<section class="history-sheet" id="historySheet">
  <div class="history-head">
    <button class="history-close" id="historyClose">×</button>
    <div class="history-title">History</div>
    <button class="history-clear" id="historyClear">⌫</button>
  </div>
  <div class="history-items" id="historyItems"></div>
</section>

<script>
(() => {
  const mainLine = document.getElementById('mainLine');
  const historyLine = document.getElementById('historyLine');
  const clearKey = document.getElementById('clearKey');
  const keys = document.getElementById('keys');

  let entry = '0';
  let accumulator = null;
  let pendingOperator = null;
  let leftDisplay = '';
  let enteringRight = false;
  let afterEquals = false;
  let lastEquation = '';
  let repeatedOperand = null;
  let repeatedOperator = null;

  let history = [];
  try { history = JSON.parse(localStorage.getItem('fakecalc-history') || '[]'); } catch {}

  function normalize(n){
    if (!Number.isFinite(n)) return 'Error';
    if (Object.is(n,-0)) return '0';
    const abs = Math.abs(n);
    if ((abs >= 1e12) || (abs > 0 && abs < 1e-10)) {
      return n.toExponential(8).replace(/\.?0+e/,'e');
    }
    return String(Number(n.toPrecision(12)));
  }

  function fmt(raw){
    if (raw === 'Error') return 'Error';
    if (/e/i.test(raw)) return raw.replace('-', '−');
    let neg = raw.startsWith('-');
    let s = neg ? raw.slice(1) : raw;
    const split = s.split('.');
    let whole = split[0] || '0';
    const decimal = split.length > 1 ? split[1] : null;
    whole = whole.replace(/^0+(?=\d)/,'') || '0';
    const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + grouped + (decimal !== null ? '.' + decimal : '');
  }

  function currentMain(){
    if (pendingOperator !== null) {
      if (enteringRight) return `${leftDisplay}${pendingOperator}${fmt(entry)}`;
      return `${leftDisplay}${pendingOperator}`;
    }
    return fmt(entry);
  }

  function fit(){
    const t = mainLine.textContent;
    const n = t.length;
    if (n > 19) mainLine.style.fontSize='clamp(28px,8vw,39px)';
    else if (n > 15) mainLine.style.fontSize='clamp(33px,9.5vw,45px)';
    else if (n > 11) mainLine.style.fontSize='clamp(39px,11vw,52px)';
    else mainLine.style.fontSize='';
  }

  function render(){
    mainLine.textContent = currentMain();
    historyLine.textContent = lastEquation;
    clearKey.textContent = (entry === '0' && pendingOperator === null && !afterEquals) ? 'AC' : 'C';

    document.querySelectorAll('.key.operator[data-op]').forEach(b=>{
      b.classList.toggle('selected', pendingOperator === b.dataset.op && !enteringRight);
    });
    fit();
  }

  function fullReset(){
    entry='0';
    accumulator=null;
    pendingOperator=null;
    leftDisplay='';
    enteringRight=false;
    afterEquals=false;
    lastEquation='';
    repeatedOperand=null;
    repeatedOperator=null;
    render();
  }

  function clearEntry(){
    if (entry === '0' && pendingOperator === null && !afterEquals) {
      fullReset();
      return;
    }
    if (pendingOperator !== null) {
      entry='0';
      enteringRight=false;
    } else {
      entry='0';
      accumulator=null;
      afterEquals=false;
      lastEquation='';
    }
    render();
  }

  function inputDigit(d){
    if (entry === 'Error') fullReset();

    if (afterEquals && pendingOperator === null) {
      lastEquation='';
      entry = d === '.' ? '0.' : d;
      afterEquals=false;
      accumulator=null;
      repeatedOperand=null;
      repeatedOperator=null;
      render();
      return;
    }

    if (pendingOperator !== null && !enteringRight) {
      entry = d === '.' ? '0.' : d;
      enteringRight = true;
      render();
      return;
    }

    if (d === '.' && entry.includes('.')) return;

    const digitCount = entry.replace(/[-.]/g,'').length;
    if (digitCount >= 12 && d !== '.') return;

    if (entry === '0' && d !== '.') entry=d;
    else if (entry === '-0' && d !== '.') entry='-'+d;
    else entry += d;
    render();
  }

  function calculate(a, op, b){
    switch(op){
      case '+': return a+b;
      case '−': return a-b;
      case '×': return a*b;
      case '÷': return b===0 ? NaN : a/b;
    }
    return b;
  }

  function chooseOperator(op){
    if (entry === 'Error') return;

    if (afterEquals) {
      lastEquation='';
      accumulator = Number(entry);
      leftDisplay = fmt(entry);
      pendingOperator = op;
      enteringRight = false;
      afterEquals = false;
      render();
      return;
    }

    if (pendingOperator !== null && enteringRight) {
      const result = calculate(accumulator, pendingOperator, Number(entry));
      entry = normalize(result);
      accumulator = Number(entry);
      leftDisplay = fmt(entry);
    } else if (pendingOperator === null) {
      accumulator = Number(entry);
      leftDisplay = fmt(entry);
    }

    pendingOperator = op;
    enteringRight=false;
    render();
  }

  function equals(){
    if (entry === 'Error') return;

    let op = pendingOperator;
    let left = accumulator;
    let right;

    if (op !== null) {
      right = enteringRight ? Number(entry) : accumulator;
      repeatedOperator = op;
      repeatedOperand = right;
    } else if (afterEquals && repeatedOperator !== null) {
      op = repeatedOperator;
      left = Number(entry);
      right = repeatedOperand;
    } else {
      return;
    }

    const equation = `${fmt(normalize(left))}${op}${fmt(normalize(right))}`;
    const value = normalize(calculate(left,op,right));

    addHistory(equation,value);
    lastEquation=equation;
    entry=value;
    accumulator=null;
    pendingOperator=null;
    leftDisplay='';
    enteringRight=false;
    afterEquals=true;
    render();
  }

  function backspace(){
    if (entry === 'Error') { fullReset(); return; }
    if (afterEquals) return;

    if (pendingOperator !== null && !enteringRight) {
      pendingOperator=null;
      accumulator=null;
      leftDisplay='';
      render();
      return;
    }

    if (entry.length <= 1 || (entry.startsWith('-') && entry.length===2)) entry='0';
    else entry=entry.slice(0,-1);
    render();
  }

  function toggleSign(){
    if (entry === '0' || entry === 'Error') return;
    entry = entry.startsWith('-') ? entry.slice(1) : '-'+entry;
    render();
  }

  function percent(){
    if (entry === 'Error') return;
    const value=Number(entry);
    if (pendingOperator !== null && accumulator !== null && enteringRight &&
        (pendingOperator==='+' || pendingOperator==='−')) {
      entry=normalize(accumulator*value/100);
    } else {
      entry=normalize(value/100);
    }
    render();
  }

  function addHistory(eq,val){
    history.unshift({eq,val});
    history=history.slice(0,50);
    localStorage.setItem('fakecalc-history',JSON.stringify(history));
  }

  function act(button){
    if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
    else if (button.dataset.op) chooseOperator(button.dataset.op);
    else {
      switch(button.dataset.action){
        case 'backspace': backspace(); break;
        case 'clear': clearEntry(); break;
        case 'percent': percent(); break;
        case 'sign': toggleSign(); break;
        case 'equals': equals(); break;
      }
    }
  }

  // Use pointer-down for visual feedback, then execute on pointer-up.
  // This mirrors the short highlight seen in the supplied iOS recording much
  // more closely than CSS :active alone, especially when installed to Home Screen.
  let pressed=null;
  let downAt=0;

  keys.addEventListener('pointerdown', e=>{
    const b=e.target.closest('.key');
    if(!b) return;
    e.preventDefault();
    if(pressed && pressed!==b) pressed.classList.remove('pressed');
    pressed=b;
    downAt=performance.now();
    b.classList.add('pressed');
    try { b.setPointerCapture(e.pointerId); } catch {}
  });

  function release(e, execute){
    const b=pressed;
    if(!b) return;
    const elapsed=performance.now()-downAt;
    // Apple-like flash stays visible briefly even on very quick taps.
    const remaining=Math.max(0,92-elapsed);
    setTimeout(()=>b.classList.remove('pressed'),remaining);
    pressed=null;
    if(execute) act(b);
  }

  keys.addEventListener('pointerup',e=>release(e,true));
  keys.addEventListener('pointercancel',e=>release(e,false));
  keys.addEventListener('pointerleave',e=>{
    if(e.pointerType==='mouse' && pressed) release(e,false);
  });

  document.addEventListener('keydown', e=>{
    if(/^[0-9.]$/.test(e.key)) inputDigit(e.key);
    else if(e.key==='+') chooseOperator('+');
    else if(e.key==='-') chooseOperator('−');
    else if(e.key==='*') chooseOperator('×');
    else if(e.key==='/') chooseOperator('÷');
    else if(e.key==='Enter' || e.key==='=') equals();
    else if(e.key==='Backspace') backspace();
    else if(e.key==='Escape') clearEntry();
    else if(e.key==='%') percent();
  });

  const sheet=document.getElementById('historySheet');
  const items=document.getElementById('historyItems');
  function renderHistory(){
    if(!history.length){
      items.innerHTML='<div class="history-empty">No Calculations</div>';
      return;
    }
    items.innerHTML=history.map(h=>
      `<div class="history-item"><div class="history-expr">${escapeHTML(h.eq)}</div><div class="history-value">${escapeHTML(fmt(h.val))}</div></div>`
    ).join('');
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  document.getElementById('historyButton').onclick=()=>{renderHistory();sheet.classList.add('open')};
  document.getElementById('historyClose').onclick=()=>sheet.classList.remove('open');
  document.getElementById('historyClear').onclick=()=>{history=[];localStorage.removeItem('fakecalc-history');renderHistory()};

  render();
})();
</script>
</body>
</html>
